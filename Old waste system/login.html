<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Lab Waste Tracker — Login</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">
<div class="container d-flex justify-content-center align-items-center" style="min-height:100vh">
  <div class="card shadow p-4" style="width:360px">
    <h4 class="mb-4 text-center">Lab Waste Tracker</h4>

    {% if mode == "password" %}
    <form method="POST" action="/auth">
      {% if wrong %}
      <div class="alert alert-danger py-2 small">Incorrect password. Try again.</div>
      {% endif %}
      <div class="mb-3">
        <label class="form-label">Lab password</label>
        <input type="password" name="password" class="form-control" autofocus required>
      </div>
      <button type="submit" class="btn btn-primary w-100">Enter</button>
    </form>

    {% else %}
    <form method="POST" action="/">
      <div class="mb-3">
        <label class="form-label">Your name</label>
        <input type="text" name="username" class="form-control" placeholder="e.g. Purin" required autofocus>
      </div>
      <button type="submit" class="btn btn-primary w-100">Enter</button>
    </form>
    {% endif %}

  </div>
</div>
</body>
</html>
