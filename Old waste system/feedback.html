<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Feedback — Lab Waste Tracker</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">
<div class="container py-4" style="max-width:700px">

  <div class="d-flex justify-content-between align-items-center mb-3">
    <h5 class="mb-0">Feedback</h5>
    <a href="/" class="text-decoration-none small">← Back to Logger</a>
  </div>

  <div class="card shadow-sm mb-4">
    <div class="card-body">
      <p class="small text-muted mb-2">
        Found a bug or have a suggestion? Comments are posted anonymously —
        no name or account info is attached.
      </p>
      <form method="POST" action="/add_comment">
        <textarea name="comment" class="form-control mb-2" rows="3"
                  placeholder="Your feedback..." required></textarea>
        <button type="submit" class="btn btn-sm btn-primary">Submit anonymously</button>
      </form>
    </div>
  </div>

  <h6 class="small fw-semibold text-muted mb-2">Previous feedback</h6>
  {% if comments %}
  <div class="list-group">
    {% for c in comments %}
    <div class="list-group-item">
      <div class="small text-muted mb-1">{{ c.created_at[:16] }}</div>
      <div style="white-space:pre-wrap">{{ c.comment }}</div>
    </div>
    {% endfor %}
  </div>
  {% else %}
  <p class="text-muted small">No feedback yet.</p>
  {% endif %}

</div>
</body>
</html>
